name: Development Autoloop Dispatch (Plan-Only)

on:
  workflow_dispatch:
    inputs:
      confirm_repository:
        description: "Type the exact owner/repository shown in this repository's URL."
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  autoloop-plan:
    name: Run Autoloop preflight and candidate selection (Plan-Only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Autoloop plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
          AUTOLOOP_STATE_BRANCH: ${{ vars.AUTOLOOP_STATE_BRANCH || 'autoloop-state' }}
          AUTOLOOP_CONFIG_PATH: config/autoloop.json
        run: node scripts/autoloop-runner.mjs
