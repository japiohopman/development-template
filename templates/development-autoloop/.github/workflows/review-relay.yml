name: Trusted review relay (guarded, no dispatch)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Observe PR review event (unprivileged)"]
    types: [completed]

# Privileged relay events use trusted default-branch workflow code only.
# A separate no-secret workflow observes pull_request_review events, then this
# workflow re-reads current reviews/checks from default-branch code on workflow_run.
# A trusted [autoloop:relay-review] PR comment is a safe manual retry path.
# This workflow never starts a provider task.
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: write

concurrency:
  group: review-relay-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || 'unknown' }}
  cancel-in-progress: false

jobs:
  review-relay:
    name: Evaluate trusted review and existing-work handoff
    if: ${{ github.event.pull_request.number || github.event.issue.pull_request || github.event.workflow_run.pull_requests[0].number }}
    runs-on: ubuntu-latest
    environment: autoloop-dispatch
    timeout-minutes: 8
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run guarded review relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          AUTOLOOP_STATE_BRANCH: ${{ vars.AUTOLOOP_STATE_BRANCH || 'autoloop-state' }}
          AUTOLOOP_CONFIG_PATH: config/autoloop.json
        run: node scripts/review-relay.mjs
